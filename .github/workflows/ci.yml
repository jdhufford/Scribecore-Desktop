name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build (unsigned)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Each installer is built separately so a failure names its target, and the
      # tail of the log is posted as an annotation (readable without signing in).
      - name: Package portable zip
        shell: bash
        run: scripts/ci-package.sh zip
      - name: Package NSIS installer
        shell: bash
        run: scripts/ci-package.sh nsis
      - name: Package MSI
        shell: bash
        run: scripts/ci-package.sh msi

      - uses: actions/upload-artifact@v4
        with:
          name: scribecore-unsigned-${{ github.sha }}
          path: |
            release/*/*.exe
            release/*/*.msi
            release/*/*.zip
          if-no-files-found: error
          retention-days: 14
