name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build (unsigned)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: scribecore-unsigned-${{ github.sha }}
          path: |
            release/*/*.exe
            release/*/*.msi
            release/*/*.zip
          if-no-files-found: error
          retention-days: 14
